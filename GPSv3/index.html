<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GP Case Management</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#667085}body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px}.phone{position:relative;width:min(412px,100vw);aspect-ratio:412/917;overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 12px 45px #0002}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}.screen>img.bg{width:100%;height:100%;display:block;object-fit:cover}.hot{position:absolute;cursor:pointer;background:transparent;border:0;padding:0;z-index:5}.hot:focus{outline:2px solid #4163a5;outline-offset:2px}.overlay{position:absolute;inset:0;pointer-events:none}.overlay>*{pointer-events:auto}.toast{position:absolute;left:18px;right:18px;bottom:92px;background:#314f91;color:#fff;padding:11px 14px;border-radius:14px;text-align:center;font-size:13px;box-shadow:0 6px 20px #0002;display:none;z-index:50}.toast.show{display:block}
.search-input{position:absolute;z-index:20;left:24px;top:134px;width:364px;height:40px;border:0;background:transparent;outline:0;padding:0 15px 0 44px;color:#667085;font-size:14px}.search-input::placeholder{color:transparent}.dynamic-filters{position:absolute;z-index:15;left:24px;top:191px;right:24px;height:40px;display:flex;gap:10px;z-index:4}.dynamic-filters button{border:1px solid #e0e4eb;background:#fff;color:#667085;border-radius:14px;font-size:14px;height:40px;padding:0 15px;flex:1}.dynamic-filters button.active{background:#a9c2f5;border-color:#a9c2f5;color:#42629b}.dynamic-list{position:absolute;left:24px;right:24px;top:247px;bottom:145px;z-index:3;overflow:auto;padding-right:2px}.ref-card{height:96px;border:1px solid #d5d8dd;border-radius:20px;background:#fff;margin-bottom:10px;padding:15px 17px;position:relative;box-shadow:0 1px 1px #00000005;cursor:pointer}.ref-card:hover{box-shadow:0 2px 10px #0001}.ref-card .name{font-weight:700;color:#3e5f9d;font-size:17px}.ref-card .id{font-size:13px;margin-top:4px}.ref-card .meta{font-size:13px;margin-top:7px}.badge{position:absolute;right:16px;top:17px;padding:3px 10px;border-radius:10px;font-size:11px}.crisis{background:#ffd9dd;color:#d97880}.high{background:#fff0f0;color:#e38a8a;border:1px solid #f5cccc}.moderate{background:#ffedcf;color:#d39a58}.low{background:#e3f5f4;color:#54aaa5}.due{background:#dceeff;color:#62a9e2}.arrow{position:absolute;right:17px;bottom:14px;font-size:20px;color:#a9afb8}.bottom-hot{bottom:17px;height:64px}.bh-home{left:24px;width:82px}.bh-tasks{left:106px;width:82px}.bh-cases{left:188px;width:82px}.bh-appt{left:270px;width:118px}
.form-input{position:absolute;z-index:20;border:1px solid #e1e4e8;border-radius:10px;background:#fff;padding:0 10px;font-size:13px;color:#667085;outline:none}.form-input:focus,.form-select:focus{border-color:#8eace9;box-shadow:0 0 0 2px #8eace933}.form-select{position:absolute;z-index:20;border:1px solid #e1e4e8;border-radius:10px;background:#fff;padding:0 9px;font-size:13px;color:#667085}.save-hot{left:205px;bottom:17px;width:105px;height:42px}.cancel-hot{left:100px;bottom:17px;width:95px;height:42px}
.tab-hot{top:111px;height:38px}.tab-overview{left:24px;width:78px}.tab-clinical{left:110px;width:94px}.tab-med{left:207px;width:94px}.tab-ref{left:302px;width:86px}
@media(max-width:412px){body{padding:0}.phone{border-radius:0;box-shadow:none}}
</style></head><body>
<div class="phone" id="app">
<section class="screen active" id="dashboard"><img class="bg" src="GP Dashboard.jpg"><div class="overlay">
<button class="hot" style="left:25px;top:138px;width:176px;height:116px" onclick="go('referrals')" aria-label="Open referrals"></button><button class="hot" style="left:212px;top:138px;width:176px;height:116px" onclick="go('detail')" aria-label="Open case review"></button><button class="hot" style="left:25px;top:269px;width:176px;height:116px" onclick="go('followup')" aria-label="Open follow-up"></button><button class="hot" style="left:212px;top:269px;width:176px;height:116px" onclick="go('detail')" aria-label="Open case"></button><button class="hot" style="left:24px;top:402px;width:364px;height:76px" onclick="go('referrals')" aria-label="Open referrals list"></button><button class="hot" style="left:24px;top:494px;width:364px;height:78px" onclick="go('detail')" aria-label="Open case review"></button><button class="hot bottom-hot bh-appt" onclick="go('referrals')" aria-label="Appointments"></button>
</div></section>

<section class="screen" id="referrals"><img class="bg" src="GP Referrals.png"><div class="overlay"><button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('dashboard')" aria-label="Back to dashboard"></button><input id="search" class="search-input" placeholder="Search by name or case ID..." oninput="renderRefs()" aria-label="Search referrals"><div class="dynamic-filters"><button data-filter="New" onclick="setFilter('New')">New (5)</button><button data-filter="In Progress" onclick="setFilter('In Progress')">In Progress (10)</button><button data-filter="Completed" onclick="setFilter('Completed')">Completed (3)</button></div><div class="dynamic-list" id="refList"></div><button class="hot bottom-hot bh-home" onclick="go('dashboard')" aria-label="Home"></button><button class="hot bottom-hot bh-tasks" onclick="toast('Tasks opened')" aria-label="Tasks"></button><button class="hot bottom-hot bh-cases" onclick="go('detail')" aria-label="Cases"></button><button class="hot bottom-hot bh-appt" onclick="go('referrals')" aria-label="Appointments"></button></div></section>

<section class="screen" id="accept"><img class="bg" src="GP Accept Referral.jpg"><div class="overlay"><button class="hot" style="left:25px;top:58px;width:42px;height:42px" onclick="go('referrals')" aria-label="Back to referrals"></button><button class="hot" style="left:24px;top:790px;width:364px;height:58px" onclick="go('detail');toast('Referral accepted')" aria-label="Accept referral"></button><button class="hot" style="left:24px;top:848px;width:176px;height:40px" onclick="go('referrals');toast('Referral declined')" aria-label="Decline referral"></button></div></section>

<section class="screen" id="detail"><img class="bg" src="GP detail review.jpg"><div class="overlay"><button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('referrals')" aria-label="Back to referrals"></button><button class="hot" style="left:24px;top:134px;width:364px;height:75px" onclick="go('overview')" aria-label="Open patient record"></button><button class="hot" style="left:24px;top:219px;width:176px;height:122px" onclick="toast('Risk details opened')" aria-label="Risk details"></button><button class="hot" style="left:212px;top:219px;width:176px;height:122px" onclick="toast('Case status opened')" aria-label="Case status"></button><button class="hot" style="left:24px;top:352px;width:364px;height:114px" onclick="go('overview')" aria-label="Open patient overview"></button><button class="hot" style="left:24px;top:480px;width:364px;height:70px" onclick="go('followup')" aria-label="Open follow-up"></button></div></section>

<!-- Patient Overview: all four tabs are clickable -->
<section class="screen" id="overview"><img class="bg" src="Patient Details Overview.jpg"><div class="overlay"><button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('detail')" aria-label="Back"></button><button class="hot tab-hot tab-overview" onclick="go('overview')" aria-label="Overview tab"></button><button class="hot tab-hot tab-clinical" onclick="go('clinical')" aria-label="Clinical Info tab"></button><button class="hot tab-hot tab-med" onclick="go('medication')" aria-label="Medication tab"></button><button class="hot tab-hot tab-ref" onclick="go('patient-referrals')" aria-label="Referrals tab"></button><button class="hot" style="left:48px;top:712px;width:316px;height:48px" onclick="go('detail');toast('Full record opened')" aria-label="View full record"></button><button class="hot" style="left:56px;top:846px;width:300px;height:55px" onclick="go('clinical')" aria-label="Start consultation"></button></div></section>

<!-- Clinical Info screen -->
<section class="screen" id="clinical"><img class="bg" src="Patient Details Clinical Assessment.jpg"><div class="overlay"><button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('overview')" aria-label="Back"></button><button class="hot tab-hot tab-overview" onclick="go('overview')" aria-label="Overview tab"></button><button class="hot tab-hot tab-clinical" onclick="go('clinical')" aria-label="Clinical Info tab"></button><button class="hot tab-hot tab-med" onclick="go('medication')" aria-label="Medication tab"></button><button class="hot tab-hot tab-ref" onclick="go('patient-referrals')" aria-label="Referrals tab"></button><select class="form-select" style="left:49px;top:350px;width:313px;height:54px" id="diagnosis"><option>F32.1 - Moderate depressive episode</option><option>F32.0 - Mild depressive episode</option><option>F33.1 - Recurrent depressive disorder</option></select><textarea class="form-input" id="treatment" style="left:49px;top:438px;width:313px;height:92px;padding-top:12px" placeholder="Free text"></textarea><textarea class="form-input" id="symptoms" style="left:49px;top:563px;width:313px;height:92px;padding-top:12px" placeholder="Free text"></textarea><textarea class="form-input" id="mental" style="left:49px;top:688px;width:313px;height:88px;padding-top:12px" placeholder="Free text"></textarea><button class="hot" style="left:56px;top:846px;width:145px;height:55px" onclick="go('overview')" aria-label="Cancel clinical info"></button><button class="hot" style="left:208px;top:846px;width:148px;height:55px" onclick="saveClinical()" aria-label="Save clinical info"></button></div></section>

<!-- Medication screen -->
<section class="screen" id="medication"><img class="bg" src="Patient Details Clinical Assessment-1.jpg"><div class="overlay"><button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('clinical')" aria-label="Back"></button><button class="hot tab-hot tab-overview" onclick="go('overview')" aria-label="Overview tab"></button><button class="hot tab-hot tab-clinical" onclick="go('clinical')" aria-label="Clinical Info tab"></button><button class="hot tab-hot tab-med" onclick="go('medication')" aria-label="Medication tab"></button><button class="hot tab-hot tab-ref" onclick="go('patient-referrals')" aria-label="Referrals tab"></button><input class="form-input" style="left:49px;top:472px;width:313px;height:53px" placeholder="Medication name" id="medSearch" aria-label="Medication name" list="meds"><datalist id="meds"><option value="Sertraline 50 mg"><option value="Fluoxetine 20 mg"><option value="Escitalopram 10 mg"><option value="Quetiapine 25 mg"><option value="Risperidone 1 mg"></datalist><input class="form-input" style="left:49px;top:559px;width:151px;height:52px" placeholder="10 mg" id="dose"><select class="form-select" style="left:211px;top:559px;width:151px;height:52px" id="frequency"><option>Once daily</option><option>Twice daily</option><option>Three times daily</option><option>As needed</option></select><select class="form-select" style="left:49px;top:647px;width:151px;height:52px"><option>Oral</option><option>Topical</option><option>Inhaled</option></select><select class="form-select" style="left:211px;top:647px;width:151px;height:52px"><option>8 weeks</option><option>2 weeks</option><option>4 weeks</option><option>12 weeks</option></select><textarea class="form-input" style="left:49px;top:720px;width:313px;height:72px;padding-top:10px" id="medNotes" placeholder="Medication instructions / notes" aria-label="Medication notes"></textarea><button class="hot" style="left:56px;top:846px;width:145px;height:55px" onclick="go('clinical')" aria-label="Cancel medication"></button><button class="hot" style="left:208px;top:846px;width:148px;height:55px" onclick="saveMedication()" aria-label="Add medication"></button></div></section>

<!-- Patient Referrals screen -->
<section class="screen" id="patient-referrals"><img class="bg" src="Patient Details Referrals.jpg"><div class="overlay">
<button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('overview')" aria-label="Back"></button>
<button class="hot" style="left:24px;top:111px;width:78px;height:38px" onclick="go('overview')" aria-label="Overview tab"></button>
<button class="hot" style="left:110px;top:111px;width:94px;height:38px" onclick="go('clinical')" aria-label="Clinical Info tab"></button>
<button class="hot" style="left:207px;top:111px;width:94px;height:38px" onclick="go('medication')" aria-label="Medication tab"></button>
<button class="hot" style="left:302px;top:111px;width:86px;height:38px" onclick="go('patient-referrals')" aria-label="Referrals tab"></button>
<select class="form-select" style="left:49px;top:316px;width:313px;height:54px" id="refReason" aria-label="Referral reason"><option>Medication review</option><option>Psychiatric assessment</option><option>Follow-up</option><option>Psychology assessment</option><option>Social support</option></select>
<select class="form-select" style="left:49px;top:405px;width:313px;height:55px" id="refUrgency" aria-label="Referral urgency"><option>Urgent</option><option>High</option><option>Routine</option></select>
<textarea class="form-input" style="left:49px;top:494px;width:313px;height:94px;padding-top:12px" placeholder="Referral summary / clinical reason" id="refSummary" aria-label="Referral summary"></textarea>
<select class="form-select" style="left:49px;top:640px;width:313px;height:40px" id="recipient1" aria-label="Primary recipient"><option>Psychiatrist</option><option>General Physician</option><option>Counselor</option><option>Psychologist</option><option>Social Worker</option></select>
<input class="form-input" style="left:49px;top:688px;width:313px;height:40px" id="recipient2" placeholder="Additional recipient / service" aria-label="Additional recipient">
<textarea class="form-input" style="left:49px;top:736px;width:313px;height:40px;padding-top:9px" id="refNotes" placeholder="Additional notes" aria-label="Additional notes"></textarea>
<button class="hot" style="left:56px;top:846px;width:145px;height:55px" onclick="go('overview')" aria-label="Cancel referral"></button>
<button class="hot" style="left:208px;top:846px;width:148px;height:55px" onclick="saveReferral()" aria-label="Save referral"></button>
</div></section>

<!-- Follow-up / Continuing Care screen -->
<section class="screen" id="followup"><img class="bg" src="Follow-Up & Continuing Care.jpg"><div class="overlay">
<button class="hot" style="left:24px;top:59px;width:42px;height:42px" onclick="go('overview')" aria-label="Back to patient overview"></button>
<input class="form-input" type="date" style="left:25px;top:374px;width:363px;height:43px" id="followDate" value="2025-09-18" aria-label="Follow-up date">
<select class="form-select" style="left:25px;top:464px;width:173px;height:43px" id="followType" aria-label="Session type"><option>Follow-up Session</option><option>Initial Session</option><option>Review Session</option><option>Care Planning</option></select>
<select class="form-select" style="left:210px;top:464px;width:178px;height:43px" id="followMode" aria-label="Session mode"><option>In-person</option><option>Telehealth</option><option>Telephone</option></select>
<select class="form-select" style="left:25px;top:555px;width:173px;height:43px" id="followLocation" aria-label="Location"><option>Counseling Room</option><option>Online</option><option>Clinic Room 2</option><option>Community</option></select>
<select class="form-select" style="left:210px;top:555px;width:178px;height:43px" id="followDuration" aria-label="Duration"><option>45 minutes</option><option>30 minutes</option><option>60 minutes</option><option>90 minutes</option></select>
<div class="editable-checklist" style="position:absolute;left:25px;top:648px;width:363px;height:177px;z-index:20;padding:12px 14px;color:#667085;font-size:12px">
<label style="display:block;margin:3px 0 9px"><input type="checkbox" id="chkMedication" checked> Medication adherence reviewed</label>
<label style="display:block;margin:3px 0 9px"><input type="checkbox" id="chkSymptoms"> Symptoms / risk reviewed</label>
<label style="display:block;margin:3px 0 9px"><input type="checkbox" id="chkSafety"> Safety plan reviewed</label>
<label style="display:block;margin:3px 0 9px"><input type="checkbox" id="chkReferral"> Referral / care coordination reviewed</label>
<label style="display:block;margin:3px 0 0"><input type="checkbox" id="chkNext"> Next appointment agreed</label>
</div>
<textarea class="form-input" style="left:25px;top:745px;width:363px;height:76px;display:none" id="followNotes" aria-label="Follow-up notes" placeholder="Follow-up notes"></textarea>
<button class="hot" style="left:56px;top:846px;width:145px;height:55px" onclick="go('overview')" aria-label="Cancel follow-up"></button>
<button class="hot" style="left:208px;top:846px;width:148px;height:55px" onclick="saveFollowup()" aria-label="Save follow-up"></button>
</div></section>

<div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<script>
const data={New:[['Sana Khan','CM-2025-000123','Psychologist','12 Aug 2025','ACTIVE CRISIS','crisis'],['Imran Ali','CM-2025-000123','CMO','12 Aug 2025','HIGH RISK','high'],['Ali Raza','CM-2025-000123','GP','12 Aug 2025','MODERATE','moderate'],['Sana Gul','CM-2025-000123','Counselor','12 Aug 2025','LOW','low'],['Laiba Khan','CM-2025-000123','CMO','12 Aug 2025','FOLLOW-UP DUE','due']], 'In Progress':[['Sana Khan','CM-2025-000123','Psychologist','12 Aug 2025','ACTIVE CRISIS','crisis'],['Imran Ali','CM-2025-000123','CMO','12 Aug 2025','HIGH RISK','high'],['Ali Raza','CM-2025-000123','GP','12 Aug 2025','MODERATE','moderate']], Completed:[['Laiba Khan','CM-2025-000123','CMO','12 Aug 2025','FOLLOW-UP DUE','due'],['Sana Gul','CM-2025-000123','Counselor','12 Aug 2025','LOW','low']]};
let filter='New', urgency='Urgent', recipient='Psychiatrist';
const state={clinical:{},medication:{},referral:{},followup:{}};
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active');if(id==='referrals')renderRefs();}
function setFilter(f){filter=f;renderRefs()}
function renderRefs(){const q=(document.getElementById('search')?.value||'').toLowerCase();document.querySelectorAll('.dynamic-filters button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const rows=data[filter].filter(r=>r.join(' ').toLowerCase().includes(q));document.getElementById('refList').innerHTML=rows.map((r,i)=>`<div class="ref-card" onclick="go('accept')" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' ')go('accept')"><div class="name">${r[0]}</div><div class="id">${r[1]}</div><span class="badge ${r[5]}">${r[4]}</span><div class="meta">Referred by: ${r[2]} &nbsp;|&nbsp; ${r[3]}</div><div class="arrow">→</div></div>`).join('')||'<div style="padding:30px;text-align:center;color:#8b94a3">No referrals found</div>'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1500)}
function saveClinical(){state.clinical={diagnosis:document.getElementById('diagnosis').value,treatment:document.getElementById('treatment').value,symptoms:document.getElementById('symptoms').value,mental:document.getElementById('mental').value};toast('Clinical information saved');go('overview')}
function saveMedication(){const name=document.getElementById('medSearch').value.trim();if(!name){toast('Enter a medication name');document.getElementById('medSearch').focus();return}state.medication={name,dose:document.getElementById('dose').value,frequency:document.getElementById('frequency').value,route:document.querySelector('#medication select:nth-of-type(2)')?.value||'Oral',duration:document.querySelector('#medication select:nth-of-type(3)')?.value||'8 weeks',notes:document.getElementById('medNotes')?.value||''};toast('Medication saved');go('clinical')}
function saveReferral(){state.referral={reason:document.getElementById('refReason').value,urgency:document.getElementById('refUrgency').value,summary:document.getElementById('refSummary').value,recipient:document.getElementById('recipient1').value,additionalRecipient:document.getElementById('recipient2').value,notes:document.getElementById('refNotes').value};toast('Referral saved');go('overview')}
function saveFollowup(){state.followup={date:document.getElementById('followDate').value,type:document.getElementById('followType').value,mode:document.getElementById('followMode').value,location:document.getElementById('followLocation').value,duration:document.getElementById('followDuration').value,checks:[...document.querySelectorAll('#followup input[type=checkbox]')].map(x=>x.checked)};toast('Follow-up saved');go('overview')}
function setUrgency(v){urgency=v;toast(v+' urgency selected')}
function toggleRecipient(v){recipient=v;toast(v+' selected')}
renderRefs();
</script></body></html>
